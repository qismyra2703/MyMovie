<!DOCTYPE html>

<html lang="en">
    <head><meta charset="UTF-8">
        <title>MyMovie - Watchlist</title>

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src * data:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css"></head>
<body>

<nav><span class="brand"> MyMovie</span><a href="index.html">Discover</a><a class="active" href="watchlist.html">My Watchlist</a></nav>
<main>
  <div id="msg" class="msg info">Manage your saved movies here.</div>

  <section class="panel"><h2>Watchlist Statistics</h2>
    <div class="stats">
      <div class="stat">Movies saved<b id="sCount">0</b></div>
      <div class="stat">Average IMDb rating<b id="sAvg">-</b></div>
      <div class="stat">Time left to watch<b id="sTime">-</b></div>
      <div class="stat">Days to finish<b id="sDays">-</b></div>
    </div>
    <div class="row" style="margin-top:12px">
      <label>I can watch (minutes per day)
        <input id="perDay" type="number" min="1" max="1440" value="120">
      </label>
      <button id="calcBtn">Calculate</button>
    </div>
  </section>

  <section class="panel" id="editPanel" hidden><h2>Edit Movie</h2>
    <div class="row">
      <label>Title<input id="eTitle" readonly></label>
      <label>Status
        <select id="eStatus"><option>Planned</option><option>Watching</option><option>Watched</option></select>
      </label>
      <label>My rating (0-10)
        <input id="eRating" type="number" min="0" max="10" step="0.5">
      </label>
      <label>Notes<textarea id="eNotes" rows="2" maxlength="200"></textarea></label>
    </div>
    <div class="row" style="margin-top:10px">
      <button id="saveEdit">Save Changes</button>
      <button class="ghost" id="cancelEdit">Cancel</button>
    </div>
  </section>

  <section class="panel"><h2>My Movies</h2>
    <table>
      <thead><tr><th>Title</th><th>Genre</th><th>Runtime</th><th>IMDb</th><th>Status</th><th>My rating</th><th>Actions</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" hidden>Your watchlist is empty. Go to Discover and add a movie.</p>
  </section>
</main>
<script src="store.js"></script>
<script src="watchlist.js"></script>
</body>
</html>
